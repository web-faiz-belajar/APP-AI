
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="APP AI - Asisten chat pribadi">
  <title>APP AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

  <div class="app-container">

    <!-- HEADER -->
    <header class="app-header">
      <button id="homeBtn" class="logo" aria-label="Beranda">
        APP AI
      </button>

      <div class="header-actions">
        <button id="bubbleBtn" class="bubble-btn"
          type="button" aria-label="Tampilkan gelembung chat">
          <span class="bubble-icon"></span>
        </button>

        <button id="menuBtn" class="menu-btn"
          type="button" aria-label="Buka menu"
          aria-expanded="false">
          ☰
        </button>
      </div>
    </header>

    <!-- OVERLAY DAN MENU SAMPING -->
    <div id="menuOverlay" class="menu-overlay" hidden></div>

    <aside id="sidebar" class="sidebar"
      aria-label="Menu navigasi" hidden>

      <div class="sidebar-header">
        <h2>Menu</h2>
        <button id="closeMenuBtn" type="button"
          aria-label="Tutup menu">✕</button>
      </div>

      <button id="newChatBtn" type="button">
        <span class="menu-icon">＋</span>
        <span>Obrolan baru</span>
      </button>

      <button id="homeMenuBtn" type="button">
        <span class="menu-icon">⌂</span>
        <span>Beranda</span>
      </button>

      <button id="searchBtn" type="button">
        <span class="menu-icon">⌕</span>
        <span>Cari obrolan</span>
      </button>

      <!-- RIWAYAT CHAT -->
      <section class="history-section">
        <div class="history-header">
          <h3>Riwayat obrolan</h3>
        </div>

        <div id="searchPanel" hidden>
          <input id="historySearchInput" type="search"
            placeholder="Cari judul atau isi obrolan..."
            autocomplete="off"
            aria-label="Cari riwayat obrolan">

          <button id="closeSearchBtn" type="button">
            Tutup pencarian
          </button>
        </div>

        <div id="historyList">
          <p>Belum ada riwayat obrolan.</p>
        </div>
      </section>

      <!-- PENGATURAN -->
      <section class="settings-section">
        <h3>Pengaturan</h3>

        <label for="themeSelect">Tema tampilan</label>
        <select id="themeSelect">
          <option value="system">Ikuti pengaturan HP</option>
          <option value="light">Terang</option>
          <option value="dark">Gelap</option>
        </select>

        <button id="renameChatBtn" type="button">
          <span class="menu-icon">✎</span>
          <span>Edit nama obrolan</span>
        </button>

        <button id="bubbleMenuBtn" type="button">
          <span class="menu-icon">◉</span>
          <span>App Bubbles</span>
        </button>

        <button id="profileBtn" class="profile-menu-btn"
          type="button">
          <span class="profile-avatar">👤</span>
          <span class="profile-info">
            <strong>Pengguna</strong>
            <small>Akun pribadi</small>
          </span>
          <span class="profile-arrow">›</span>
        </button>
      </section>
    </aside>

    <!-- AREA UTAMA -->
    <main id="mainContent">
      <section id="welcomeScreen" class="welcome-screen">
        <div class="ai-avatar">AI</div>
        <h1>Ada yang bisa saya bantu?</h1>
        <p>Tanyakan apa saja</p>
      </section>

      <section id="chatMessages" class="chat-messages"
        aria-live="polite" aria-label="Pesan obrolan">
      </section>
    </main>

    <!-- AREA INPUT -->
    <footer class="chat-footer">
      <form id="chatForm">
        <div class="message-input-area">

          <label for="fileInput" class="tool-btn attach-btn"
            aria-label="Pilih file" title="Lampirkan file">
            +
          </label>

          <input id="fileInput" type="file"
            accept="image/*,.pdf,.txt,.doc,.docx" hidden>

          <textarea id="messageInput" rows="1"
            placeholder="Tulis pesan..."
            aria-label="Tulis pesan"></textarea>

          <button id="voiceBtn" type="button"
            class="tool-btn voice-btn"
            aria-label="Fitur suara" title="Fitur suara">
            🎙️
          </button>

          <button id="sendBtn" type="submit"
            aria-label="Kirim pesan" title="Kirim pesan">
            ↑
          </button>
        </div>

        <p id="fileStatus" class="file-status"
          aria-live="polite"></p>
      </form>
    </footer>

  </div>

  <!-- GELEMBUNG CHAT MENGAMBANG -->
  <button id="floatingBubble" class="floating-bubble"
    type="button" aria-label="Buka obrolan mengambang" hidden>
    AI
  </button>

  <!-- JENDELA CHAT MENGAMBANG -->
  <section id="bubbleWindow" class="bubble-window"
    aria-label="Obrolan mengambang" hidden>

    <header class="bubble-window-header">
      <div class="bubble-window-title">
        <span class="bubble-window-avatar">AI</span>
        <div>
          <strong>APP AI</strong>
          <small>Asisten pribadi</small>
        </div>
      </div>

      <button id="closeBubbleWindowBtn" type="button"
        aria-label="Tutup jendela chat">✕</button>
    </header>

    <div id="bubbleMessages" class="bubble-messages"
      aria-live="polite">
    </div>

    <form id="bubbleForm" class="bubble-form">
      <textarea id="bubbleInput" rows="1"
        placeholder="Tulis pesan..."
        aria-label="Tulis pesan gelembung"></textarea>

      <button id="bubbleSendBtn" type="submit"
        aria-label="Kirim pesan">↑</button>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
