
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#101522">

    <title>APP AI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Halaman utama -->
    <div class="app-container">

        <!-- Header -->
        <header class="app-header">

            <button id="homeBtn"
                    class="logo"
                    aria-label="Beranda">
                APP AI
            </button>

            <div class="header-actions">

                <button id="bubbleBtn"
                        class="bubble-btn"
                        aria-label="Buka gelembung chat">
                    <span class="bubble-icon"></span>
                </button>

                <button id="menuBtn"
                        class="menu-btn"
                        aria-label="Buka menu"
                        aria-expanded="false">
                    ☰
                </button>

            </div>
        </header>

        <!-- Menu samping -->
        <div id="menuOverlay" class="menu-overlay" hidden></div>
        <aside id="sidebar" class="sidebar"
               aria-label="Menu navigasi" hidden>

            <div class="sidebar-header">
                <h2>Menu</h2>
                <button id="closeMenuBtn"
                        aria-label="Tutup menu">
                    ✕
                </button>
            </div>

            
            <button id="newChatBtn">
                <span class="menu-icon">＋</span>
                <span>Obrolan baru</span>
            </button>

            <button id="homeMenuBtn">
                <span class="menu-icon">⌂</span>
                <span>Beranda</span>
            </button>

            <button id="searchBtn">
                 <span class="menu-icon">⌕</span>
                 <span>Cari obrolan</span>
            </button>


            <section class="history-section">
                <h3>Riwayat obrolan</h3>
                <div id="historyList">
                    <p>Belum ada riwayat obrolan.</p>
                </div>
            </section>

            <section class="settings-section">
                <h3>Pengaturan</h3>

                <label for="themeSelect">
                    Tema tampilan
                </label>

                <select id="themeSelect">
                    <option value="system">
                        Ikuti pengaturan HP
                    </option>
                    <option value="light">
                        Terang
                    </option>
                    <option value="dark">
                        Gelap
                    </option>
                </select>

                <button id="renameChatBtn">
                    <span class="menu-icon">✎</span>
                    <span>Edit nama obrolan</span>
                </button>

                <button id="bubbleMenuBtn">
                    <span class="menu-icon">◉</span>
                    <span>App Bubbles</span>
                </button>
                
                <button id="profileBtn" class="profile-menu-btn">
                    <span class="profile-avatar">F</span>

                    <span class="profile-info">
                        <strong>Pengguna</strong>
                        <small>Akun pribadi</small>
                    </span>

                    <span class="profile-arrow">›</span>
                </button>

            </section>

        </aside>

        <!-- Konten chat -->
        <main id="mainContent">

            <section id="welcomeScreen"
                     class="welcome-screen">

                <div class="ai-avatar">AI</div>

                <h1>Ada yang bisa saya bantu?</h1>

                <p>
                    Tanyakan apa saja
                </p>

            </section>

            <section id="chatMessages"
                     class="chat-messages"
                     aria-live="polite"
                     aria-label="Pesan obrolan">
            </section>

        </main>

        <!-- Area input pesan -->
        <footer class="chat-footer">

            <form id="chatForm">

                <div class="message-input-area">

                  <label for="fileInput"
                         class="tool-btn attach-btn"
                         aria-label="Pilih file">
                       +
                </label>

             <input id="fileInput"
                    type="file"
                    accept="image/*,.pdf,.txt,.doc,.docx"
                    hidden>

        <textarea id="messageInput"
                  rows="1"
                  placeholder="Tulis pesan..."
                  aria-label="Tulis pesan"></textarea>

    <button id="voiceBtn"
            type="button"
            class="tool-btn voice-btn"
            aria-label="Rekam voice note">
        🎙️
    </button>

    <button id="sendBtn"
            type="submit"
            aria-label="Kirim pesan">
        ↑
    </button>

</div>

    <!-- Gelembung di dalam halaman website -->
    <button id="floatingBubble"
            class="floating-bubble"
            aria-label="Buka obrolan mengambang"
            hidden>
        AI
    </button>

    <!-- JavaScript -->
   <script src="script.js"></script>

</body>
</html>
