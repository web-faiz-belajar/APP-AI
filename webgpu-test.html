
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APP AI - GPU Diagnostic</title>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }
    button {
      background: #2563eb;
      color: white;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      width: 100%;
    }
    #result {
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>APP AI</h2>
  <p>GPU Diagnostic System</p>

  <div class="card">
    <button onclick="diagnostic()">Periksa GPU</button>
    <div id="result">Menunggu pemeriksaan...</div>
  </div>

  <script>
    async function diagnostic() {
      const result = document.getElementById("result");
      result.innerHTML = "Memeriksa perangkat...";

      try {
        const adapter = await navigator.gpu?.requestAdapter();

        if (!adapter) {
          result.innerHTML = "GPU adapter tidak ditemukan.";
          return;
        }

        const device = await adapter.requestDevice();

        const f16 = adapter.features.has("shader-f16");
        const memory = navigator.deviceMemory || "Tidak tersedia";

        result.innerHTML = `
          <h3>Hasil Pemeriksaan</h3>
          WebGPU: BERHASIL<br>
          Shader F16: ${f16 ? "DIDUKUNG" : "TIDAK DIDUKUNG"}<br>
          Max Buffer: ${device.limits.maxBufferSize} bytes<br>
          RAM perkiraan browser: ${memory} GB<br>
          <br>
          <b>GPU berhasil diperiksa.</b>
        `;

        device.destroy();

      } catch (error) {
        result.innerHTML = "Error: " + error.message;
      }
    }
  </script>
</body>
</html>
